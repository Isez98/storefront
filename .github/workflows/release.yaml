name: PR Release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pr-release:
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install semantic-release and plugins
        run: |
          npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github conventional-changelog-conventionalcommits

      - name: Run semantic-release (dynamic versioning)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --branches=${{ github.event.pull_request.base.ref }}

      # Optionally, create a source zip and attach to release
      - name: Get latest release tag
        id: get_release
        run: |
          response=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest)
          latest_tag=$(echo "$response" | jq -r '.tag_name')
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Install AWS SAM CLI
        id: install_sam
        run: |
          pip install aws-sam-cli
          sam --version

      - name: Building with AWS SAM
        id: build_sam
        run: |
          sam build

      - name: Create source zip
        id: zip
        run: |
          repo_name=$(basename $GITHUB_REPOSITORY)
          zip_name="${repo_name}-${{ steps.get_release.outputs.tag }}.zip"
          sam build && \
          cd .aws-sam/build/HelloWorldFunction && \
          zip -r ../../"$zip_name" . && \ cd ../.. \
            -x "*.git*" \
            -x ".github/*" \
            -x "docs/*" \
            -x "*.DS_Store"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT

      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_release.outputs.tag }}
          name: ${{ github.repository }}@${{ steps.get_release.outputs.tag }}
          body: |
            Release triggered from PR #${{ github.event.issue.number }} by comment.
          files: ${{ steps.zip.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
